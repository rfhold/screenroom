static_resources:
  listeners:
    - name: public
      address:
        socket_address: {address: 0.0.0.0, port_value: 50051}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: public
                codec_type: AUTO
                route_config:
                  name: client
                  virtual_hosts:
                    - name: client
                      domains: ["*"]
                      routes:
                        - match: {path: /__screenroom_instance}
                          direct_response:
                            status: 200
                            body: {filename: /runtime/identity.json}
                        - match: {prefix: /screenroom.catalog.v1.}
                          route: {cluster: catalog, timeout: 60s}
                        - match: {prefix: /artwork/}
                          route: {cluster: catalog, timeout: 60s}
                        - match: {prefix: /screenroom.user.v1.UserService/}
                          route: {cluster: user, timeout: 60s}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: catalog
      connect_timeout: 5s
      type: STRICT_DNS
      http2_protocol_options: {}
      load_assignment:
        cluster_name: catalog
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: catalog, port_value: 50052}
    - name: user
      connect_timeout: 5s
      type: STRICT_DNS
      http2_protocol_options: {}
      load_assignment:
        cluster_name: user
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: user, port_value: 50053}
