version: v2
plugins:
  - local: protoc-gen-prost
    out: crates/screenroom-proto/src/generated
    opt:
      - 'type_attribute=.screenroom.client.v1=#[derive(serde::Serialize)]'
      - 'type_attribute=.screenroom.client.v1=#[derive(serde::Deserialize)]'
      - 'field_attribute=.screenroom.client.v1.UpdatePreferencesRequest.update_mask=#[serde(skip)]'
  - local: protoc-gen-tonic
    out: crates/screenroom-proto/src/generated
    opt:
      - no_transport=true
