version: v2
plugins:
  - local: protoc-gen-prost
    out: crates/screenroom-proto/src/generated
    opt:
      - 'type_attribute=.screenroom.catalog.v1=#[derive(serde::Serialize)]'
      - 'type_attribute=.screenroom.catalog.v1=#[derive(serde::Deserialize)]'
      - 'type_attribute=.screenroom.user.v1=#[derive(serde::Serialize)]'
      - 'type_attribute=.screenroom.user.v1=#[derive(serde::Deserialize)]'
      - 'type_attribute=.screenroom.common.v1=#[derive(serde::Serialize)]'
      - 'type_attribute=.screenroom.common.v1=#[derive(serde::Deserialize)]'
  - local: protoc-gen-tonic
    out: crates/screenroom-proto/src/generated
    opt:
      - no_transport=true
