name: Screenroom
options:
  minimumXcodeGenVersion: 2.44.1
  preGenCommand: bash scripts/prepare-core.sh
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SCREENROOM_TELEMETRY_ENVIRONMENT: production
    INFOPLIST_KEY_ScreenroomTelemetryEnvironment: $(SCREENROOM_TELEMETRY_ENVIRONMENT)
    PRODUCT_NAME: Screenroom
    INFOPLIST_KEY_CFBundleDisplayName: Screenroom
targetTemplates:
  Shell:
    type: application
    sources:
      - Sources
      - path: ../../target/client-core/bindings/ScreenroomClientCore.swift
    dependencies:
      - framework: ../../target/client-core/apple/ScreenroomClientCore.xcframework
        embed: false
    settings:
      base:
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../target/client-core/bindings
        PRODUCT_BUNDLE_IDENTIFIER: tv.screenroom
      configs:
        Debug:
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
  HomeE2ETests:
    type: bundle.ui-testing
    sources:
      - E2ETests
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: tv.screenroom.$(TARGET_NAME)
targets:
  Screenroom-iOS:
    templates: [Shell]
    sources:
      - Resources/iOS
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  Screenroom-macOS:
    templates: [Shell]
    sources:
      - Resources/macOS
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Resources/macOS/Screenroom.entitlements
  Screenroom-tvOS:
    templates: [Shell]
    sources:
      - Resources/tvOS
    platform: tvOS
    deploymentTarget: "17.0"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  Screenroom-iOS-E2ETests:
    templates: [HomeE2ETests]
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: Screenroom-iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
  Screenroom-macOS-E2ETests:
    templates: [HomeE2ETests]
    platform: macOS
    deploymentTarget: "14.0"
    dependencies:
      - target: Screenroom-macOS
  Screenroom-tvOS-E2ETests:
    templates: [HomeE2ETests]
    platform: tvOS
    deploymentTarget: "17.0"
    dependencies:
      - target: Screenroom-tvOS
schemes:
  Screenroom-iOS:
    build:
      targets:
        Screenroom-iOS: all
    test:
      targets: [Screenroom-iOS-E2ETests]
  Screenroom-macOS:
    build:
      targets:
        Screenroom-macOS: all
    test:
      targets: [Screenroom-macOS-E2ETests]
  Screenroom-tvOS:
    build:
      targets:
        Screenroom-tvOS: all
    test:
      targets: [Screenroom-tvOS-E2ETests]
