name: Screenroom
options:
  minimumXcodeGenVersion: 2.44.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_NAME: Screenroom
    INFOPLIST_KEY_CFBundleDisplayName: Screenroom
targetTemplates:
  Shell:
    type: application
    sources:
      - Sources
targets:
  Screenroom-iOS:
    templates: [Shell]
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.screenroom.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  Screenroom-macOS:
    templates: [Shell]
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.screenroom.macos
        ENABLE_APP_SANDBOX: YES
  Screenroom-tvOS:
    templates: [Shell]
    platform: tvOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.screenroom.tvos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
