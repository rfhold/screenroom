[package]
name = "screenroom-user"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "screenroom-user"

[dependencies]
screenroom-backend = { path = "../screenroom-backend" }
screenroom-catalog-adapter = { path = "../screenroom-catalog-adapter" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenroom-observability = { path = "../screenroom-observability", features = ["telemetry"] }
screenroom-proto = { path = "../screenroom-proto" }
tokio.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport", "router"] }
tonic-web.workspace = true
tracing.workspace = true
tower-http.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
