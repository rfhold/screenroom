[package]
name = "screenroom-catalog"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
screenroom-backend = { path = "../screenroom-backend" }
axum = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenroom-observability = { path = "../screenroom-observability", features = ["telemetry"] }
screenroom-proto = { path = "../screenroom-proto" }
tokio = { workspace = true, features = ["process"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport", "router"] }
tonic-web.workspace = true
tracing.workspace = true
tower-http.workspace = true
