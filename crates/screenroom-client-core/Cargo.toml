[package]
name = "screenroom-client-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
screenroom-proto = { path = "../screenroom-proto" }
tonic.workspace = true
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
uniffi = { version = "0.31", features = ["tokio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic-web-wasm-client = "0.9.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"

[[bin]]
name = "screenroom-uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tonic = { workspace = true, features = ["router"] }
