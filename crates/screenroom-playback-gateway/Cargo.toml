[package]
name = "screenroom-playback-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hmac = "0.12"
opentelemetry.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
screenroom-backend = { path = "../screenroom-backend" }
screenroom-catalog-adapter = { path = "../screenroom-catalog-adapter" }
screenroom-proto = { path = "../screenroom-proto" }
screenroom-observability = { path = "../screenroom-observability", features = ["telemetry"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid"] }
tokio = { workspace = true, features = ["time", "sync"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport", "router"] }
tonic-web.workspace = true
tracing.workspace = true
tower-http.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
