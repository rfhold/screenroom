[package]
name = "screenroom-backend"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
screenroom-observability = { path = "../screenroom-observability" }
screenroom-queue = { path = "../screenroom-queue" }
screenroom-catalog-adapter = { path = "../screenroom-catalog-adapter" }
aws-credential-types = "1"
bytes = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
pgvector = { version = "0.4", features = ["sqlx"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { workspace = true, features = ["time", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[[bin]]
name = "screenroom-migrate"
path = "src/bin/migrate.rs"
