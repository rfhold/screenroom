[package]
name = "screenroom-observability"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:tonic-tracing-opentelemetry",
    "dep:tokio",
    "dep:http",
    "dep:uuid",
    "dep:http-body",
    "dep:tower",
    "dep:reqwest",
    "dep:rustls",
    "dep:webpki-roots",
]
profiling = ["dep:pyroscope"]

[dependencies]
opentelemetry = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
pyroscope = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tonic-tracing-opentelemetry = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
http = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
http-body = { version = "1", optional = true }
tower = { version = "0.5", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
bytes = "1"
http-body = "1"
http-body-util = "0.1"
tokio-stream.workspace = true
