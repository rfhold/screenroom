[package]
name = "screenroom-index-operator"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
screenroom-backend = { path = "../screenroom-backend" }
screenroom-proto = { path = "../screenroom-proto" }
screenroom-observability = { path = "../screenroom-observability", features = ["telemetry"] }
tokio.workspace = true
tonic = { workspace = true, features = ["transport", "router"] }
tonic-web.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
