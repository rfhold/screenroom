[package]
name = "screenroom-index-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
screenroom-backend = { path = "../screenroom-backend" }
screenroom-catalog-adapter = { path = "../screenroom-catalog-adapter" }
screenroom-observability = { path = "../screenroom-observability", features = ["telemetry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true, features = ["time", "sync"] }
tracing.workspace = true
