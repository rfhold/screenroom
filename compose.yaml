services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-screenroom}
      POSTGRES_USER: ${POSTGRES_USER:-screenroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screenroom-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
