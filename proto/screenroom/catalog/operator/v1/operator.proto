syntax = "proto3";

package screenroom.catalog.operator.v1;

// Private trusted-local operator listener only, with no public ingress routes.
service IngestionService {
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
}

message IngestionPolicy {
  string id = 1;
  string source_id = 2;
  // Server-assigned version of the single current policy row.
  uint64 version = 3;
  bool enabled = 4;
  // UTF-8 JSON object, at most 16 KiB, validated against the source provider's
  // selection schema. Library IDs are stable public strings. No credentials,
  // adapter URLs, raw jobs, or arbitrary worker instructions are permitted.
  string selection_json = 5;
  uint32 max_items_per_run = 6;
  uint32 max_requests_per_run = 7;
  uint32 incremental_seconds = 8;
  uint32 reconcile_seconds = 9;
  bool enrich_metadata = 10;
  bool enrich_people = 11;
  bool enrich_artwork = 12;
}
message IngestionRun {
  string id = 1;
  // Immutable policy snapshot, including the version captured at run creation.
  IngestionPolicy policy = 2;
  // queued, running, paused, completed, failed, or cancelled.
  string state = 3;
  uint64 items_processed = 4;
  uint64 requests_made = 5;
  // UTC RFC 3339; empty until the corresponding transition occurs.
  string started_at = 6;
  string finished_at = 7;
  // Validated JSON object, at most 16 KiB. Describes only the selected library
  // traversal or bounded feed windows, never provider-wide completeness.
  string coverage_json = 8;
  // Safe machine code only; no provider payloads, queries, or credentials.
  string error_code = 9;
}
message GetPolicyRequest { string policy_id = 1; }
message GetPolicyResponse { IngestionPolicy policy = 1; }
message UpdatePolicyRequest {
  // Full replacement of the existing policy; id/source_id are immutable.
  // Input version is ignored: a row lock protects the server-side increment.
  // Update and creation of any associated run/job commit atomically.
  IngestionPolicy policy = 1;
}
message UpdatePolicyResponse { IngestionPolicy policy = 1; }
message StartRunRequest { string policy_id = 1; }
message StartRunResponse {
  // A locked policy and unique active-run constraint prevent duplicates.
  IngestionRun run = 1;
}
message GetRunRequest { string run_id = 1; }
message GetRunResponse { IngestionRun run = 1; }
message CancelRunRequest { string run_id = 1; }
message CancelRunResponse { IngestionRun run = 1; }
