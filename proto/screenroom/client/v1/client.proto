syntax = "proto3";

package screenroom.client.v1;

import "google/protobuf/field_mask.proto";

service BrowseService {
  rpc GetHome(GetHomeRequest) returns (GetHomeResponse);
  rpc ListLibraries(ListLibrariesRequest) returns (ListLibrariesResponse);
  rpc ListLibraryItems(ListLibraryItemsRequest) returns (ListLibraryItemsResponse);
}
service CatalogService {
  rpc GetCatalogInfo(GetCatalogInfoRequest) returns (GetCatalogInfoResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc ListChildren(ListChildrenRequest) returns (ListChildrenResponse);
  rpc ListCredits(ListCreditsRequest) returns (ListCreditsResponse);
}
service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetSearchCapabilities(GetSearchCapabilitiesRequest) returns (GetSearchCapabilitiesResponse);
}
service PreferencesService {
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
}

message Rights {
  string label = 1;
  string note = 2;
  string source = 3;
  string license_url = 4;
  string attribution = 5;
}
message Artwork {
  string id = 1;
  string url = 2;
  string label = 3;
  string creator = 4;
  string license = 5;
  string source = 6;
  string license_url = 7;
  string kind = 8;
}
message Credit {
  string id = 1;
  string name = 2;
  string role = 3;
  string department = 4;
  Artwork artwork = 5;
}
message CatalogNotice {
  string id = 1;
  string section = 2;
  string title = 3;
  string text = 4;
  string link_label = 5;
  string link_url = 6;
}
message CatalogInfo {
  repeated Artwork artwork = 1;
  repeated CatalogNotice notices = 2;
  string retrieved_at = 3;
}
message Rating {
  string provider = 1;
  double value = 2;
  double scale = 3;
  optional uint64 votes = 4;
  string retrieved_at = 5;
}
message Runtime {
  optional uint32 seconds = 1;
  optional uint32 minimum_seconds = 2;
  optional uint32 maximum_seconds = 3;
  string note = 4;
  string display = 5;
}
message ProviderReference {
  string provider = 1;
  string status = 2;
  string url = 3;
}
message Item {
  string id = 1;
  string title = 2;
  string kind = 3;
  optional string parent_id = 4;
  uint32 year = 5;
  string subtitle = 6;
  string overview = 7;
  repeated string tags = 8;
  repeated string colors = 9;
  string release_date = 10;
  uint32 added_order = 11;
  Rights title_rights = 12;
  Rights metadata_rights = 13;
  Artwork artwork = 14;
  Rating rating = 15;
  Runtime runtime = 16;
  repeated ProviderReference provider_references = 17;
  optional uint32 progress_percent = 18;
  repeated string provenance_notes = 19;
  string metadata_retrieved_at = 20;
}
message Page {
  uint32 size = 1;
  string token = 2;
}
message Library {
  string id = 1;
  string title = 2;
}
message HomeRow {
  string id = 1;
  string title = 2;
  repeated Item items = 3;
}
message SearchTypes {
  bool movie = 1;
  bool series = 2;
  bool episode = 3;
}
message SearchMethods {
  bool title_only = 1;
  bool text = 2;
  bool fuzzy = 3;
  bool semantic = 4;
}
message Preferences {
  SearchTypes search_types = 1;
  SearchMethods search_methods = 2;
  string library_id = 3;
  string source = 4;
  // Stable IDs: off, library_tracks, transcription. Mock default: off.
  string subtitle_preference = 5;
}
message GetHomeRequest { string library_id = 1; }
message GetHomeResponse { repeated HomeRow rows = 1; }
message ListLibrariesRequest {}
message ListLibrariesResponse { repeated Library libraries = 1; }
message ListLibraryItemsRequest {
  string library_id = 1;
  Page page = 2;
}
message ListLibraryItemsResponse {
  repeated Item items = 1;
  string next_page_token = 2;
}
message GetItemRequest { string id = 1; }
message GetCatalogInfoRequest {}
message GetCatalogInfoResponse { CatalogInfo info = 1; }
message GetItemResponse { Item item = 1; }
message ListChildrenRequest {
  string parent_id = 1;
  Page page = 2;
}
message ListChildrenResponse {
  repeated Item items = 1;
  string next_page_token = 2;
}
message ListCreditsRequest {
  string item_id = 1;
  Page page = 2;
}
message ListCreditsResponse {
  repeated Credit credits = 1;
  string next_page_token = 2;
}
message SearchRequest {
  string query = 1;
  string library_id = 2;
  SearchTypes types = 3;
  SearchMethods methods = 4;
  string source = 5;
  Page page = 6;
}
message SearchResponse {
  repeated Item items = 1;
  string next_page_token = 2;
}
message GetSearchCapabilitiesRequest {}
message GetSearchCapabilitiesResponse {
  repeated string methods = 1;
  repeated string types = 2;
  repeated string sources = 3;
  string semantic_description = 4;
  uint32 maximum_query_length = 5;
}
message GetPreferencesRequest {}
message GetPreferencesResponse { Preferences preferences = 1; }
message UpdatePreferencesRequest {
  Preferences preferences = 1;
  google.protobuf.FieldMask update_mask = 2;
}
message UpdatePreferencesResponse { Preferences preferences = 1; }
