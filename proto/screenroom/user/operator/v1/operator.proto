syntax = "proto3";

package screenroom.user.operator.v1;

// Private trusted-local operator listener only. Network separation is not
// authentication; no public client ingress routes are permitted.
service JellyfinUserService {
  rpc SetLink(SetLinkRequest) returns (SetLinkResponse);
  rpc ClearLink(ClearLinkRequest) returns (ClearLinkResponse);
}

message JellyfinUserLink {
  // Screenroom local user UUID.
  string user_id = 1;
  // Stable installation source ID, not a provider name.
  string source_id = 2;
  string jellyfin_user_id = 3;
}
message SetLinkRequest { JellyfinUserLink link = 1; }
message SetLinkResponse { JellyfinUserLink link = 1; }
message ClearLinkRequest {
  string user_id = 1;
  string source_id = 2;
}
message ClearLinkResponse {}
